<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Patxanga v2</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <noscript>
        <div class="card error">
          Activa JavaScript para ver el contenido dinámico del QR.
        </div>
      </noscript>
      <article class="card">
        <header>
          <p class="eyebrow">Patxanga Team</p>
          <h1 id="campaign-title">Cargando contenido</h1>
          <p id="campaign-description" class="description">
            Estamos preparando la configuración del día para ti.
          </p>
          <p id="item-description" class="item-description">
            Cargando descripción del contenido activo.
          </p>
        </header>
        
        <div id="media-container" class="media-container" aria-live="polite">
          <div class="loader" id="loader"></div>
        </div>
        
        <footer class="meta">
          <div>
            <dt>Today content</dt>
            <dd id="effective-date">...</dd>
          </div>
          <div>
            <dt>Active content</dt>
            <dd id="content-name">...</dd>
          </div>
        </footer>

        <aside class="visit-counter" aria-label="Contador de visitas">
          <div class="visit-counter-top">
            <div class="visit-counter-stats">
              <span class="visit-counter-label">Visits count</span>
              <img
                class="visit-counter-badge"
                src="https://hitscounter.dev/api/hit?url=https%3A%2F%2Fchispasgg.github.io%2Fpatxangav2%2F&label=&icon=award&color=%2313ff00&message=&style=plastic&tz=UTC"
                alt="Contador de visitas"
              />
            </div>
            <button id="random-phrase-button" class="phrase-button" type="button">
              get your Taj wise advice
            </button>
          </div>
          <p id="random-phrase-message" class="phrase-message" hidden></p>
        </aside>
        
        <section class="ruleta-panel" aria-label="Ruleta rusa">
          <div class="ruleta-header">
            <span class="ruleta-label">Russian Roulette</span>
            <button id="ruleta-button" class="ruleta-button" type="button" aria-label="Girar ruleta">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="604" height="604" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/>
                <circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/>
                <line x1="12" y1="2"  x2="12" y2="9"/>
                <line x1="12" y1="15" x2="12" y2="22"/>
                <line x1="2"  y1="12" x2="9"  y2="12"/>
                <line x1="15" y1="12" x2="22" y2="12"/>
                <line x1="4.93"  y1="4.93"  x2="9.17"  y2="9.17"/>
                <line x1="14.83" y1="14.83" x2="19.07" y2="19.07"/>
                <line x1="19.07" y1="4.93"  x2="14.83" y2="9.17"/>
                <line x1="9.17"  y1="14.83" x2="4.93"  y2="19.07"/>
              </svg>
            </button>
          </div>
          <p id="ruleta-message" class="ruleta-message" hidden></p>
        </section>

        <section class="message-panel" aria-label="Enviar mensaje">
          <label for="message-input" class="message-label">Send a message to Taj</label>
          <div class="message-controls">
            <textarea id="message-input" class="message-input" rows="3" placeholder="Write down what you want Taj to drink or do. Don be evil"></textarea>
            <button id="message-send-button" class="message-send-button" type="button">Send</button>
          </div>
          <p id="message-feedback" class="message-feedback" hidden></p>
        </section>

        <p id="error-message" class="error" hidden></p>
      </article>
    </main>
    <script src="app.js?v=2" defer></script>
  </body>
</html>
